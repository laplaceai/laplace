[project]
name = "laplace-engine"
version = "0.1.0"
description = "The live engine: hourly forecasts, their Merkle commitments on-chain, and the public record."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "eth-abi>=5.1",
  "eth-hash[pycryptodome]>=0.7",
  "laplace-research",
  "numpy>=2.1",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.uv.sources]
laplace-research = { path = "../research", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laplace_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["laplace_engine", "laplace_research"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["laplace_engine"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
