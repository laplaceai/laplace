[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
fuzz = { runs = 2_000 }
# The engine writes shared test vectors here (see engine/src/laplace_engine/vectors.py).
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fmt]
line_length = 120
